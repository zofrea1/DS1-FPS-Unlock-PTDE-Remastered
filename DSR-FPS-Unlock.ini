# DSR-FPS-Unlock
# Place dinput8.dll and this file next to DarkSoulsRemastered.exe.
# The game loads that DLL name. Do not rename the DLL.
#
# In System -> PC Settings -> Display, set Frequency to the monitor refresh
# and set Vertical sync to off. Restart the game after changing TargetFPS.
# The game keeps real-time speed when the PC cannot hold TargetFPS (see
# VariableFrameTime below).

[Framerate]
# Set false to leave the game completely unchanged.
FPSUnlock = true

# Frame rate cap, in frames per second. 61 through 1000. Pick what your PC can
# usually hold; dips below it no longer slow the game down.
TargetFPS = 240

# Give the game the measured frame time every frame instead of a fixed
# 1/TargetFPS. With this on, gameplay, physics, animation, menus and the mouse
# stay at real-time speed when the frame rate dips, and TargetFPS only caps the
# rate. Set false for the older behaviour (a fixed step, so the game runs slow
# whenever the PC falls below TargetFPS).
VariableFrameTime = true

# De-duplicates menu button presses so one press is not seen several times per
# frame at a high frame rate. Turn this off if a menu ever stops responding.
MenuInputFilter = true

# Use the real frame time in the move-control dispatcher instead of a fixed 1/60.
# Fixes ladder slides overshooting the floor at high FPS. Set false to A/B test.
FixMoveDt = true

# Keep the ground snap-down (how far the game pulls the character onto the floor
# each frame) at the retail rate per second. Fixes the downward boost when walking
# off ledges/lips and the ladder slide-down clip at high FPS. Set false to A/B test.
FixStepDown = true

# Makes the lock-on camera pan (switching targets, locking onto an enemy near the
# edge of the screen) take the same time at any frame rate. Without it the camera
# snaps to the target at a high frame rate. Set false to A/B test.
FixCamera = true

# The lock-on camera weights are the ones the 30 FPS game used, applied once per
# frame, so Remastered at 60 FPS pans twice as fast as the original. Set true to
# pan at the original speed instead (what Prepare to Die Edition feels like).
# Needs FixCamera.
CameraPtdeSpeed = false

# Diagnostic only. Puts hardware write watchpoints on character height and logs
# the code address of any big vertical step to %TEMP%\DSR-FPS-Unlock-watch-<pid>.txt.
# Implies Trace. Leave false for normal play.
Watch = false

# Diagnostic only. Writes DSR-FPS-Unlock-trace-<pid>.csv to %TEMP% with one row
# per character update (before and after), and costs a little per update while
# on. Turn it back off when the capture is done.
Trace = false
