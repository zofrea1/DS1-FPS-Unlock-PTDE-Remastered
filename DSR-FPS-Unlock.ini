# DSR-FPS-Unlock  v2.0.1  (Dark Souls: Remastered)
# Place dinput8.dll and this file next to DarkSoulsRemastered.exe.
# The game loads that DLL name. Do not rename the DLL.
#
# In System -> PC Settings -> Display, set Frequency to the monitor refresh rate
# and set Vertical sync to off. Restart the game after changing MaxFPS.
# Recommended: borderless fullscreen (best monitor, frame pacing and VRR compatibility).
# Only the current Steam build of the game is supported (see the README).

[Framerate]
# Master switch for the whole mod. Set false to turn every part of it off and leave
# the game unchanged, except StartOffline and SkipIntro below, which have their own
# switches.
FPSUnlock = true

# Frame rate cap, 10 through 1000 (a value outside that range is clamped to the
# nearest end). The game runs in real time at any frame rate from 1000 down to 10,
# so this only limits how fast frames are drawn. Pick what your PC can hold, or
# a lower cap such as 30 for steady frame pacing.
# (Earlier versions called this TargetFPS; that name still works.)
MaxFPS = 120

# Give the game the measured frame time every frame. Gameplay, physics, animation,
# menus and the mouse keep real-time speed when the frame rate dips. Set false for
# the old behaviour: a fixed 1/MaxFPS step, so the game runs slow below MaxFPS.
VariableFrameTime = true

# De-duplicates menu button presses so one press is not seen several times per
# frame at a high frame rate. Turn this off if a menu ever stops responding.
MenuInputFilter = true

# After resting at a bonfire the character can stay seated with no menu and no way to
# stand. When an idle sit and no open menu last for a second, the character is told to
# stand. An older name, BonfireUnstick, is still accepted.
BonfireFix = true

[Online]
# Start the game in offline mode. Just before the game reads its launch setting
# (Network settings -> Launch setting) after the title screen, the mod sets it to
# Start Offline, so the game takes its own offline path instead of logging in. Playing
# offline keeps the modded game off the online servers, where players have reported
# temporary bans. Has no effect when Seamless Co-op is loaded (it has its own
# networking). To play online again, set this to false and, in game, set Network
# settings -> Launch setting back to Start Online (the game may have saved Start
# Offline). Works whether or not FPSUnlock is on. DisableOnlineMode is accepted as
# another name for this key.
StartOffline = true

[Startup]
# Skip the Bandai Namco, FromSoftware and other start-up logos: the game goes straight
# on to the title screen. Works whether or not FPSUnlock is on, and alongside Seamless
# Co-op. Set false to see them. IntroSkip is accepted as another name for this key.
SkipIntro = true

[Physics]
# Several movement systems were written for a fixed frame rate and count once per
# frame instead of per second. Each fix below scales one of them with the frame
# time. Set one to false to compare.

# Slope gravity and friction of the slide.
FixSlide = true

# Airborne horizontal momentum (jump distance, walk-off momentum), and how far
# ground-crawling projectiles slide (the undead dragon's acid).
FixDamping = true

# Running jumps keep their full distance when the take-off loses a frame of the
# jump animation (half-length jumps at low frame rates, most often at 30 FPS).
FixJump = true

# The walk-speed check that slows the character when its per-frame movement is
# small (grazing a wall, or simply running at a high frame rate).
FixGraze = true

# Real frame time in the move-control dispatcher instead of a fixed 1/60.
# Ladder slides overshoot the floor at a high frame rate without it.
FixMoveDt = true

# Keeps the ground snap-down at the retail rate per second. Stops the downward
# boost on ledges and lips and the ladder fall-through at a high frame rate.
FixStepDown = true

# Lock-on camera: switching targets and locking onto an enemy near the edge of the
# screen take the same time at any frame rate instead of snapping.
FixCamera = true

# Lock-on body turn: the torso, head and hips turn to face the locked-on target at
# the Remastered 60 FPS speed instead of snapping round at a high frame rate.
FixLockOnTurn = true

# Foot IK: the feet placed on stairs and slopes, and the hips lowered so both feet
# reach, follow the frame time. The hips followed each step of a staircase several
# times faster at a high frame rate, so running up or down stairs and slopes bobbed.
FixFootIk = true

# Remastered pans the lock-on camera and turns the body toward the target twice as
# fast as the original game (it kept the 30 FPS per-frame values). On for the
# original Dark Souls speed. Set false for Remastered's own speed. Needs FixCamera
# and FixLockOnTurn. (Earlier builds called this CameraPtdeSpeed; that name still
# works. Before 1.5.0 the included INI left this off.)
LockOnPtdeSpeed = true

# Original game movement. Remastered runs the same movement code as Prepare to Die
# Edition, but several of its values are still the original game's per-frame values
# applied 60 times a second (twice as often), and two were changed. Each switch below
# uses the original game's value, so movement behaves as in PTDE at any frame rate.
# Set one to false for Remastered's own behaviour.

# Slide momentum left after sliding off a steep slope fades and stops as in the
# original game (Remastered stops it twice as fast). Needs FixSlide.
SlideFrictionPtde = true

# Running into a wall or a corner slows the character down, and it picks up speed
# again afterwards, at the original game's pace (Remastered does both twice as fast).
# Needs FixGraze.
GrazePtde = true

# The ground snap holds the character to ground that drops away under it (a rounded
# ledge, a steep slope) only as far as the original game did, 0.4 m per 1/30 s.
# Remastered holds on to ground that drops twice as fast, so there the character starts
# to fall later. Needs FixStepDown.
StepDownPtde = true

# The highest step the character climbs without a jump is 0.30 m as in the original
# game (Remastered 0.31 m).
StepHeightPtde = true

# Momentum in the air after walking or running off a ledge fades at the original game's
# rate, about 2% faster over a second than in Remastered. Needs FixDamping.
AirDampingPtde = true

# Projectiles at the original game's rates. Remastered kept the original game's
# per-frame values for ground-crawling projectiles but applies them 60 times a second,
# so the undead dragon's acid loses its slide speed twice as fast and stops shorter
# than in the original game, and repeating projectiles fire on a 60 FPS schedule (the
# dragon's acid stream twice as often). true: the original game's slide and schedule at
# any frame rate. false: Remastered's own at any frame rate. Needs FixDamping (slide)
# and FixTimers (schedule). Also picks the frames FixBulletHitTiming follows.
BulletPtdeSpeed = true

# Foot IK at the original game's speed. Remastered kept the original game's per-frame
# foot IK values, so at 60 FPS the hips settle onto stairs and slopes twice as fast as
# in the original game. Needs FixFootIk.
FootIkPtdeSpeed = true

# Bloodstain and wandering ghost replays play at the original speed, and your own
# replay data (bloodstains, ghost data sent to other players) is recorded in real
# time instead of once every few frames. Ghosts move evenly between samples, and
# ghosts and other players' characters turn at the original speed instead of
# overshooting and snapping back.
FixGhosts = true

# Per-frame 1/60 second timers: the weapon buff glow fading in and out, the ragdoll
# blend-in, the glow on dropped items and a load queue countdown, and the interval
# between volleys of repeating projectiles (breath and spit attacks).
FixTimers = true

# The follow camera's pivot and look-at point ease toward their targets by 1/60 of the
# gap a frame.
FixSmoothing = true

# Velocities the game works out from one frame's movement, assuming 60 frames a second:
# the powered ragdoll that pulls a body toward a pose, and the speed of moving sounds
# that FMOD uses for the Doppler pitch shift (too weak at a high frame rate, too strong
# at a low one).
FixVelocity = true

# Enemy AI scripts clear out their used memory at least as often as at 60 FPS (every
# 30 frames). The game does it on a half-second timer while the scripts use up memory
# every frame, so at a high frame rate several times as much built up between clean-ups.
# In crowded areas (Blighttown, the Catacombs) the script memory could run out, and the
# game then closed itself (the 1.6.0 crash reports at 360 FPS).
FixScriptMemory = true

# HUD gauges: the Estus fill on the health bar, stamina and boss bars fill at the original
# speed instead of racing at a high frame rate.
FixUI = true

# HUD bars at the original game's speed. Remastered kept the original game's per-frame
# steps for its HUD bars (health, stamina, boss) but applies them 60 times a second, so
# they fill and drain twice as fast as in Prepare to Die Edition (an Estus heal, the
# yellow part of the stamina bar draining away). true moves them at the original game's
# speed, false at Remastered's. Needs FixUI.
HudPtdeSpeed = true

# Sprinting takes one stamina point every 0.1 s. The game rounded each tick up to a whole
# frame and dropped the remainder, so the drain ran at 8.7 per second at 61 FPS, 9.5 at 120
# and 9.7 at 240. true keeps the remainder: 10 per second at any frame rate (what 60 FPS gave).
FixStaminaTick = true

# Steep slides. The game records "feet on the slide" once a frame. At a high frame rate
# that record can miss for a single frame at the lip, and the slide animation cancels.
# The record is kept until it has been missing for one native frame (see SlidePtdeSpeed).
# At the native rate and below nothing changes.
FixSlideContact = true

# Steering on a slide. The turn animation restarts every frame, so its only live layer
# is one frame old. Havok then throws out most of the root motion, and the legs move while
# the body barely does; the higher the frame rate, the less the body moves. The weight
# threshold follows the frame time, so a slide turns the same distance at any frame rate.
FixSlideSteer = true

# Which frame rate the two slide fixes reproduce. true: the original game's (30 FPS).
# Remastered kept the original game's animation blend times but runs at 60 FPS, so a
# slide's turn carries a quarter of the original game's weight there; true gives the
# original game's slide at any frame rate. false: Remastered's own slide (60 FPS) at any
# frame rate. Needs FixSlideContact / FixSlideSteer.
SlidePtdeSpeed = true

# The soul counter on the HUD. It added its whole step once a frame, so a large pickup
# finished several times too fast at a high frame rate. The step follows the frame
# time: at the original game's speed with HudPtdeSpeed true, at Remastered's with it false.
# A hitch adds at most four of the game's steps.
FixSoulCounter = true

# Kick (forward + R1) and jumping attack (forward + R2). The game only takes a push of the
# stick as a flick if it gets from neutral past the threshold between two frames, and a
# press only counts with it if both land in the same frame. At a high frame rate a frame
# is much shorter, so kicks and jumping attacks often came out as plain attacks. Both
# tests follow native frames in real time (see StickInputPtdeSpeed).
FixStickFlick = true

# Roll direction. The game remembers the stick for its last 5 frames and rolls the way
# it was pushed, even if it was let go just before the roll button. At 240 FPS that is
# only 0.02 s, so a push let go of a moment early came out as a backstep (or nothing).
# The memory covers 5 native frames in real time (see StickInputPtdeSpeed).
FixRollDirection = true

# Switchback. Reversing the stick while running or sprinting plays a quick turn-around
# animation when the stick's direction swings more than 105 degrees within one frame.
# At a high frame rate a frame is so short that the swing almost never fits in one, so
# the switchback rarely played. The swing is measured over native frames in real time
# (see StickInputPtdeSpeed).
FixSwitchback = true

# Which frames FixStickFlick, FixRollDirection and FixSwitchback follow. true: the
# original game's (30 FPS): the most forgiving kick and jumping attack timing, the roll
# remembers the stick for 0.13 s, a switchback needs the swing within 1/30 s. false:
# Remastered's own (60 FPS) at any frame rate: the push and the press have to be twice
# as quick, the roll remembers the stick for 0.067 s, the swing has to fit in 1/60 s.
# (StickFlickPtdeSpeed is accepted as another name.)
StickInputPtdeSpeed = true

# Status build-up from the ground and other effects that are kept up by being applied
# again and again (Blighttown's swamp: poison). An effect's time is counted down by
# whole frames, and the next one only comes once the game has seen the old one run out,
# so at a high frame rate the swamp poisoned faster (45 points a second at 240 FPS,
# 36 at Remastered's own 60). Effects run out on native frames in real time (see
# SpEffectPtdeSpeed).
FixSpEffectTiming = true

# Which frames FixSpEffectTiming follows. true: the original game's (30 FPS); the swamp
# poisons 30 points a second, as in the original game. false: Remastered's own (60 FPS)
# at any frame rate, 36 points a second.
SpEffectPtdeSpeed = true

# Lingering attacks that hit again while you stand in them (the clouds of Poison Mist
# and Toxic Mist, Acid Surge, Vow of Silence, Chaos Storm, enemy multi-hit attacks).
# After a hit the target is left alone for the attack's re-hit time, counted down by
# whole frames, so at a high frame rate those areas hit more often (Toxic Mist 17% more
# often at 240 FPS than in the original game). The re-hit time runs out on native frames
# in real time: the original game's 30 FPS with BulletPtdeSpeed, else Remastered's own
# 60 FPS.
FixBulletHitTiming = true

# Holding D-pad down jumps back to the first quick item (Estus) after a short hold. The
# game counts the hold in frames (15), so at a high frame rate it fired during an ordinary
# tap. true makes the hold take a quarter second at any frame rate.
FixDpadHold = true

[Diagnostics]
# Development only. Leave these false for normal play.

# Writes DSR-FPS-Unlock-trace-<pid>.csv to %TEMP% with one row per character
# update. Large, and costs a little per update.
Trace = false

# Hardware write watchpoints on character height; logs the code address of any
# big vertical step to %TEMP%. Implies Trace.
Watch = false

# Log the D-pad / HUD shortcut actions with timestamps, to diagnose repeat speed.
# Hold the D-pad for a few seconds, then read the [input] lines in the log.
InputLog = false
