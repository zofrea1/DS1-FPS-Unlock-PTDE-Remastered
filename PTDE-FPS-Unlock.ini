# PTDE-FPS-Unlock (development build)
# Place xinput1_3.dll and this file next to DARKSOULS.exe. It loads alongside DSfix
# (which uses DINPUT8.dll); the two do not share a file name.
#
# This mod drives the frame rate. If you use DSfix, set "unlockFPS 0" in DSfix.ini
# so the two do not both write the same timestep. (If it is left on, this mod still
# wins, because it writes after DSfix each frame.)

[Framerate]
# Set false to leave the game completely unchanged.
FPSUnlock = true

# Frame rate cap. The game runs at 30 natively. 31 through 1000.
TargetFPS = 240

# Write the measured frame time into the game's fixed 1/30 step each frame, so game
# speed stays correct at any frame rate and when the frame rate drops. Set false to
# only observe (log the survey) without changing anything.
Driver = true

# Stop the render thread waiting two vertical blanks per frame (the 30 FPS lock),
# the same change DSfix makes.
VblankPatch = true

# Skip the startup intro logos. This is independent of DSfix's skipIntro, which stops
# working once other DSfix features are turned off; set that one to 0 so the two do
# not act at once.
SkipIntro = false

# The game re-presents a frame in a catch-up loop until the display's vblank counter
# reaches its 30 FPS schedule. Set true to skip that loop (experimental; try this if
# a variable-refresh display bounces between refresh rates).
SkipPresentRepeat = false

# Borderless fullscreen: strips the window frame and stretches the window over its
# monitor. Set the game to WINDOWED mode in its display settings first. This avoids
# exclusive fullscreen, where the game always picks 60 Hz; the display then runs at
# the desktop refresh rate. Skipped if DSfix's own borderlessFullscreen is on.
BorderlessFullscreen = false

# Log a per-second frame and command summary for this many seconds after start.
# 0 = off.
Survey = 120
