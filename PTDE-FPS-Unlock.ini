# PTDE-FPS-Unlock  v3.1.0  (Dark Souls: Prepare to Die Edition)
# Place xinput1_3.dll and this file next to DARKSOULS.exe. It loads alongside DSfix
# (which uses DINPUT8.dll); the two do not share a file name.
# Only the current Steam build of the game is supported (see the README).
#
# This mod drives the frame rate. If you use DSfix, set "unlockFPS 0" in DSfix.ini
# so the two do not both write the same timestep. (If it is left on, this mod still
# wins, because it writes after DSfix each frame.)
#
# The first part of this file holds the settings you may want to change: the frame rate
# cap and the display. Everything after the line further down is set the way the mod is
# meant to be played.

[Display]
# FPS Unlock Settings: an in-game page with the settings you may want to change while
# playing: the frame rate cap, the refresh rate, the HUD size, the picture and the draw
# distance (and in Prepare to Co-op Edition the co-op's own). Open it with
# SettingsMenuKey, or on a controller with Y anywhere in the game's System menu. Each
# change is written to this file at once; most apply at once, the others after a
# restart of the game, and the page says which.
SettingsMenu = true
# The key that opens and closes FPS Unlock Settings: F1 to F12, or none.
SettingsMenuKey = F1

# Frame rate cap, 10 through 1000 (a value outside that range is clamped to the
# nearest end). The game runs in real time at any frame rate from 1000 down to 10,
# so this only limits how fast frames are drawn. Pick what your PC can hold, or
# a lower cap such as 30 (the original frame rate) for steady frame pacing.
# With G-SYNC / FreeSync (variable refresh), the smoothest picture comes from a cap
# your PC holds in most areas, not the highest it reaches in the lightest ones: while
# the game keeps to the cap every frame is the same length and the display refreshes
# evenly (EvenFrameSteps); where it cannot keep up, the frames come unevenly again.
# Watch the frame rate in a busy area (Blighttown, Anor Londo, Lost Izalith) and cap a
# little below it. Keep it below your display's refresh rate as well (for example 225
# or lower on a 240 Hz display).
# (Earlier builds called this TargetFPS; that name still works.)
MaxFPS = 120

# Fullscreen refresh rate. The game's PC settings offered only 59/60 Hz; with this mod
# its Frequency lists every rate your display offers at the chosen resolution.
# 0 = the rate chosen there, or the highest while that is still the game's own 60 Hz
#     (the PC settings screen then shows the rate in use) (the default)
# -1 = the game's choice alone (and its 59/60 Hz list)
# N = N Hz (falling back to the highest below it)
# Applies only when the game is in fullscreen, not windowed or BorderlessFullscreen.
# Recommended: fullscreen with this at 0 (the best monitor, frame pacing and G-SYNC /
# FreeSync compatibility). With YieldToDSFix = true beside DSfix, DSfix's fullscreenHz
# decides instead.
FullscreenRefreshRate = 0

# Borderless fullscreen: strips the window frame and stretches the window over its
# monitor. Set the game to WINDOWED mode in its display settings first; the display then
# runs at the desktop refresh rate. Skipped if DSfix's own borderlessFullscreen is on.
# auto = only when the game runs on DXVK (DXVK = true), where borderless keeps HDR,
#        G-SYNC / FreeSync and even frame pacing; with the game's own Direct3D 9,
#        exclusive fullscreen is better and the window is left as the game makes it
#        (the default)
# true = always   false = never
BorderlessFullscreen = auto

# With Windows display scaling above 100% (Settings > Display > Scale), draw the game at
# the monitor's real pixels. Without it, Windows has the game draw a smaller picture
# and stretches it up (blurry, and in borderless no G-SYNC / FreeSync, which needs the
# picture to fill the screen pixel for pixel). In windowed mode the window then has
# exactly the size chosen in the game's options. No effect at 100% scaling.
DpiAware = true

# =======================================================================================
# DSfix. YieldToDSFix is only for using DSfix's own picture settings (its resolution,
# depth of field, HUD scale and so on). To use DSfix for anything else beside this mod's
# picture (DSfix 3.0 for its quality-of-life features, for example), leave it false.
# false (the default): with DSfix installed, this mod's picture settings below take
# precedence where both have one: RenderResolution decides the resolution (DSfix's
# renderWidth and renderHeight are then left unused) and AnisotropicFiltering the
# texture filtering.
# true = this mod steps back wherever DSfix has a setting of its own, and DSfix's
# settings decide there (including leaving something at the game's own). These settings
# of this mod then do nothing:
#   RenderResolution, Supersampling  (DSfix: renderWidth, renderHeight, presentWidth,
#                                     presentHeight, and its anti-aliasing and SSAO
#                                     made at that resolution)
#   DepthOfFieldStrength, DepthOfFieldResolution  (DSfix: dofOverrideResolution,
#                                     dofBlurAmount, disableDofScaling)
#   EffectsResolution, WaterResolution, HighPrecisionColor  (they need this mod's resolution)
#   AnisotropicFiltering             (DSfix: filteringOverride)
#   UIScale, UIScaleWorld, UIScaleText, UIScaleMenus, FixBossBarOverlap  (DSfix: its HUD
#                                     mod, enableHudMod, hudScale..., menuScale; the game
#                                     draws its HUD and menus as without this mod, where
#                                     DSfix 3.0's HUD mod and weaponWearBars look for them)
#   FixAspect, FixAspectUI           (a screen other than 16:9 keeps the game's 16:9
#                                     picture, so the HUD stays where DSfix 3.0 looks)
#   ShadowMapResolution              (the game's own 2048 map)
#   FullscreenRefreshRate            (DSfix: fullscreenHz)
# Everything else stays this mod's: the frame rate, AlphaToCoverage,
# AntialiasingSamples, FixSun, FixWater, the other window settings and every fix.
# Without DSfix installed this does nothing. DSfix's
# resolution needs the game's own anti-aliasing off (with it on, the 3D picture fills
# only a corner of the screen): this mod keeps it off while DSfix makes the resolution,
# whatever the game's Antialiasing option says (DSfix's aaType smooths the picture).
YieldToDSFix = false

# RTX Remix (for example the Dark Souls PTDE RTX mod) replaces the game's renderer with a
# path tracer and expects the game's own render passes. auto (the default): when RTX Remix
# is installed beside the game (a d3d9.dll and .trex\NvRemixBridge.exe), this mod leaves
# the picture to it: RenderResolution, depth of field, effects, water, colour, shadows,
# filtering, FixAspect, UIScale, DXVK, the Direct3D-level speed-ups (FastEffects,
# FastRenderMath, AsyncReadback, ReuseSurfaces, PreloadTextures, FilterSamplerStates,
# SkipUnusedReflection), the effects fixes (FixSfxSpawnRate, FixSfxActions,
# FixSfxDistortion, FixSfxSway, FixSfxTrails), FixCutsceneCamera, HideMouseCursor,
# CacheInputReads and SkipIntro are off, whatever they say here. The frame rate, every
# gameplay fix and FixController stay, and so does FullscreenRefreshRate: RTX Remix sets
# the fullscreen display mode itself (at 60 Hz), and this mod makes that mode use the rate
# chosen here.
# Turn off the RTX mod's own FPS unlock ([FPSUnlock] Enabled=0 in its
# rtx_comp\settings\remix-comp-proxy.ini): this mod drives the frame rate.
# true = always, false = never.
YieldToRtxRemix = auto
# =======================================================================================

# Fill a screen that is not 16:9: taller (the Steam Deck's 1280x800) or wider (21:9
# and 32:9 ultrawide). The game otherwise keeps a 16:9 picture and leaves the rest
# black. On a taller screen the horizontal view stays and the extra height shows more
# of the world; on a wider one the vertical view stays and the extra width does. A
# 16:9 display is unchanged, and the in-game list does not need the display's own
# mode. Leave DSfix presentWidth and presentHeight at 0 so this can choose the size.
# Movies are made for 16:9 and are stretched to fill the screen. false keeps the bars,
# and so does YieldToDSFix = true beside DSfix (DSfix's HUD mod looks for the HUD at
# the game's own places).
FixAspect = true

# With FixAspect on such a screen: the HUD and the menus keep their 16:9 shape in the
# middle of the picture. false stretches them to the screen's shape with the picture
# (a little taller on a Steam Deck, a third wider at 21:9).
FixAspectUI = true

# The size of the HUD in percent (50 to 150; 100 is the game's). Each part of the HUD is
# drawn smaller (or larger) by the game's own placement, toward its own corner or edge:
# the health and stamina bars with the status icons (top left), the equipment slots with
# the item and spell names (bottom left), the soul counter (bottom right), a boss's health
# bar, the prompts and plates such as "Used Dungeon Cell Key" (bottom edge), the build-up
# meters and notices such as "POISONED" (about their own place). Each part is one of the game's own dialogs, so whatever
# overlaps it (an enemy's bar, a meter, a menu over the HUD) leaves it as it is. The
# menus and conversations have a size of their own (UIScaleMenus); banners such as
# YOU DIED and area names keep the game's.
UIScale = 100

# The size of the marks over things in the world in percent (50 to 150): enemies' and
# other players' floating health bars with their names and damage numbers, and the
# lock-on marker, each about its own middle.
UIScaleWorld = 100

# The size of the letters in the HUD and the marks above: item and spell names, the soul
# count, prompts, item windows, a boss's name, damage numbers. auto draws each text at
# the size of its part (UIScale, or UIScaleWorld for the marks), so it stays inside its
# box. A number (50 to 150) is the letters' size in percent of the game's, whatever the
# parts' size, for example 80 for larger letters in a HUD at 60; letters larger than
# their part can run past their box. The menus' letters go with the menus.
UIScaleText = auto

# The size of the in-game menus in percent (50 to 150). The screens (inventory,
# equipment, status, system, options, the bonfire's Level Up, Attune Magic, Repair and
# Bottomless Box, shops) shrink toward the middle of the screen, so more of the game shows
# around them on every side; the start menu on its own toward its top right corner; the
# bonfire's menu and the list of choices when talking to a character toward their top
# left corner; message boxes ("X has died") toward the bottom edge; the game's questions
# with OK and CANCEL ("Are you sure you want to quit the game?") toward the middle. What a
# character says keeps its place, its letters at this size. auto follows UIScale; false
# keeps the game's size. The mouse pointer follows the menus at their size.
UIScaleMenus = auto

# While a boss's health bar is shown, the prompts ("Pick up item", "Recover lost power")
# and the item windows above them move up so the boss's name and bar stay in view. The
# game draws them over the bar. false keeps the game's places.
FixBossBarOverlap = true

# Resolution of the 3D scene and the HUD. The game draws its world at 1024x720 and its
# HUD at 1280x720 and stretches both to your screen. auto draws them at your monitor's
# resolution; WIDTHxHEIGHT (for example 2560x1440) picks one; off keeps the game's own.
# Depth of field, glare and bloom keep their original sizes, so they look as they did;
# they are made from every pixel of the larger scene and stretched smoothly, so they
# neither shimmer nor show blocks.
# Takes precedence over DSfix's renderWidth, renderHeight and dofOverrideResolution
# (they are ignored while this is on). DSfix's hudScaleFactor has no effect with it.
RenderResolution = auto

# Anti-aliasing: draws Supersampling times the resolution above in each direction and
# scales the picture down to it, each screen pixel the exact average (in linear light) of
# the pixels it covers. 1 is off; 1.5 or 2 smooth every edge, foliage included, without
# blur or smearing in motion, at the cost of GPU time (2 is four times the pixels).
Supersampling = 1

# Depth of field strength in percent: 100 is the game's own blur of what is far away (and
# very near), 0 none (everything as sharp as what is in focus), 50 half, up to 200. Works
# with RenderResolution (any setting but 0).
DepthOfFieldStrength = 100

# The game makes the depth of field's blur from 512x360 and 256x180 pictures of the scene.
# At a high RenderResolution those show as soft blocks in the blurred background and
# around what is in focus. half makes the same blur, measured to be as strong as the
# game's, from pictures of half your resolution: smooth, without blocks (about 0.06 ms
# of GPU time a frame at 4K). full makes the same blur from pictures of your full
# resolution: just as true to the game, but a blur hides the finer pictures, so it looks
# almost the same as half for about six times the GPU time (0.35 ms a frame at 4K) and
# about 200 MB of video memory. half (the default) is the better choice; game keeps the
# game's. Works with RenderResolution (any setting but 0).
DepthOfFieldResolution = half

# The game draws its soft effects (glows, mist, fog, smoke) into a small 512x360 picture
# and stretches it over the scene. At a high RenderResolution that shows: a glow or the
# fog ends in blocks and steps where grass, a wall or a character crosses it. half draws
# them at half your resolution (1920x1080 at 4K) in fine colour steps and lays them over
# the scene with the game's own depth-aware upsample at the 2x it was made for: the
# closest to the game's look (it drew them at half its 1024x720 too). half is the
# default. full draws them at your resolution against the scene's own depth: the
# sharpest, crisper than the game ever drew them (soft edges of mist and glows get
# harder), and heavy smoke and fog close to the camera cost a lot of GPU time at 4K.
# game keeps the game's 512x360. Works with RenderResolution (any setting but 0).
EffectsResolution = half

# Water: its reflection and its ripples. The game draws the mirrored scene a pool reflects
# into a 256x180 picture and the small waves into a 512x360 one, so at a high
# RenderResolution the reflection crawls and dances as soon as the camera moves (at 4K
# each of its pixels covers 15x12 of the screen, where the game drew it over 4x4 at its
# 1024x720) and the ripples stay coarse. half draws them at the game's own ratios to your
# resolution (at 4K: the reflection 960x540, the ripples 1920x1080) and is the default.
# full draws both twice as fine. game keeps the game's sizes. Works with RenderResolution
# (any setting but 0); with YieldToDSFix, DSfix decides (see FixWater).
WaterResolution = half

# The game keeps its 3D scene in 8 bits per colour: every layer of fog, smoke or glow is
# rounded to one of 256 steps, and the game then brightens and grades the picture, which
# widens those steps. Thin fog and dark skies show bands, and the halo of a pulsing glow
# shows rings that crawl as it pulses. true (the default) keeps the scene in 10 bits per
# colour (four times the steps, in the same memory as the game's 8) and dithers the
# finished picture into your screen's 8 bits, so they fade smoothly, for about 3% of the
# frame rate. float keeps it in 16-bit float instead: as smooth, about 12% of the frame
# rate (true uses it where the graphics driver cannot blend into 10 bits). false keeps the
# game's 8 bits. Works with RenderResolution (any setting but 0). Beside DSfix it stays on
# unless DSfix's SMAA runs on this picture: DSfix.ini renderWidth x renderHeight the same
# size as RenderResolution, or a 1024x720 picture, which DSfix makes its render size. SMAA
# needs the 8-bit picture. DSfix's FXAA and SSAO are fine.
HighPrecisionColor = true

# With HighPrecisionColor: the finished picture goes to the screen in 10 bits per colour
# instead of 8, so dark gradients stay smooth with no dither at all. In 8 bits the picture
# is dithered into the screen's steps: a fine noise, different for red, green and blue and
# new every frame, so over a few frames each pixel shows its true shade. (Up to 2.9.0 the
# dither was a fixed grid that showed in dark places as lighter, whitish dots crawling as
# the camera moved, with or without HDR.)
# auto = 10 bits with DXVK on a display Windows composes above 8 bits (HDR or Auto Color
#        Management on); on the Steam Deck and Linux (Proton) with HDR on, when the game's
#        window can take a 10-bit picture (gamescope, the Steam Deck OLED); else 8 bits
#        (the default)
# true = 10 bits whenever DXVK or Proton is used (under Proton only where the window can
#        take them)
# false = 8 bits, dithered
# Needs DXVK = true on Windows; not beside DSfix. Same memory and frame rate in either.
HighPrecisionOutput = auto

# With anti-aliasing on (AntialiasingSamples below), grass, leaves, hair and fences get
# smooth edges too (alpha to coverage), where they otherwise stay hard and break up into
# dots in the distance. They stay solid inside; only their outline is smoothed. No
# effect while anti-aliasing is off.
AlphaToCoverage = true

# Anti-aliasing: smooth edges on everything drawn (the game's own multisampling).
# 2 (the game's own sample count), 4 or 8 turn it on whatever the game's Antialiasing
# option says (in its PC settings, or Antialiasing under [DisplaySettingFilter] in
# %LOCALAPPDATA%\NBGI\DarkSouls\DarkSouls.ini), which is often left off after DSfix,
# which needs it off. More samples give smoother edges (and smoother grass with
# AlphaToCoverage) at more GPU cost. off = none. game = the game's option decides (2x
# while it is on), as this mod did up to 3.0.0. Beside DSfix, while DSfix makes the
# resolution, it stays off (DSfix's own anti-aliasing applies). Off and on change at
# once in FPS Unlock Settings; another sample count after a restart.
AntialiasingSamples = 2

# With anti-aliasing on, black specks no longer appear on grass and
# leaves in a ring around the player (about 13 m away, and fainter closer in). The game
# keeps the scene's depth for the effects in 8 bits per channel, and blending the
# anti-aliasing's samples at the edge of a blade could turn that depth several metres
# wrong; the low-resolution mist and smoke laid over the scene by it then darkened those
# pixels. The game as shipped does it too. true keeps that depth exact through the
# anti-aliasing, as one 32-bit number per sample (the same size as the game's, so no
# measurable cost). No effect while anti-aliasing is off; not while DSfix is
# installed.
FixAntialiasingDepth = true

# The shadow map's resolution: 2048 (the game's own), 4096 (the default) or 8192. A
# larger map gives finer shadow edges and makes the texel weave on lit, rounded surfaces
# finer, at more GPU cost and video memory (4096: about 130 MB, 8192: about 510 MB).
ShadowMapResolution = 4096

# Which map pieces are drawn. The game draws only the pieces seen from the room you stand in,
# so some grass, rocks and ruins showed up only from certain places (the grass on the ledge
# below Firelink's overlook appears only once you are inside the shrine).
#   game      as the game does (the default up to 2.7.0)
#   adjacent  also the pieces seen from the rooms next to yours (the default since 2.8.0)
#   adjacent+ also those seen from the rooms up to three steps away (the neighbours'
#             neighbours and theirs; since 2.8.0): most of what you can look down on
#             or across, without the far parts of the map all brings (from the Undead
#             Burg's bridge 33 of the map's 128 rooms, adjacent 10: the detailed lower
#             Burg below). A good choice for a fast PC and the Steam Deck (about 120 FPS
#             on average there, playing through the Undead Burg).
#   all       every piece of the loaded maps wherever you stand. Costly where a map holds
#             much more than the rooms around you: at the Demon Ruins bonfire, facing Lost
#             Izalith, 294 -> 212 FPS at 4K (render thread 3.4 -> 4.7 ms a frame), about
#             242 FPS with OcclusionCulling below.
# Their cost where it is highest that we know of: on the Undead Burg's bridge looking down
# on the lower Burg, at 4K with everything else as shipped: game 307 FPS, adjacent 237,
# adjacent+ 172, all 137 (render thread 3.2, 4.2, 5.8, 7.3 ms a frame). At Firelink about
# 2% in any of them.
# Many surfaces exist twice, a detailed piece and a cheaper stand-in for the rooms that
# see it from afar (from the Undead Burg's bridge the game draws a simplified lower Burg).
# With adjacent and all the detailed one wins (since 2.8.0): a stand-in is hidden and the
# detailed pieces of its surfaces are drawn in its place, and where two pieces still
# overlap in one plane the coarser is drawn a hair behind the finer, so they never flicker
# over each other (z-fighting). Where two rooms just have their own versions of the same
# surfaces (a cliff built twice), or two versions run apart and cross each other, the one
# your room shows stays. The detailed pieces take the
# sun's shadows and the lights nearby that the stand-ins leave out, so the lower Burg seen
# from the bridge is darker, as when you stand in it, and costs more (320 -> 271 FPS at
# 4K looking down on it). Coarse far backdrops are drawn only where the game draws them
# (Darkroot's valley floor below the Burg showed its cut edges from Solaire's platform).
# A piece another room shows is left out while you stand inside its bounds: it belongs to
# a room that reaches into yours (at the bottom of Havel's tower, Darkroot Basin's ground
# crossed the room at waist height). Since 2.8.0.
# The map pieces, their effects (torch fire, mist), their lights and, with
# DrawMapObjects below, their objects: characters and sounds keep the game's rooms (since
# 2.8.0). Up to 2.7.0 characters were loaded with the pieces, which woke every character
# of the map (with all, Solaire went missing from his place past the Taurus Demon; loading
# them also starts boss fights and sets enemies walking before you arrive: the Bell
# Gargoyles' fight began with the player on the bridge, 2026-11-21). A character the game
# has loaded nearby but does not show from your room is drawn too (at the game's lower
# update rate for unseen characters). Firelink Shrine's crow and the people at the shrine (the Crestfallen
# Warrior, the Fire Keeper and those who come over the game), checked to be safe, stay
# loaded wherever Firelink is and are updated every frame, so they are seen from the
# aqueduct to the Undead Burg; one you have angered keeps the game's rooms.
DrawMapPieces = adjacent

# With DrawMapPieces adjacent or all: the objects of the rooms it adds are loaded and drawn
# too, as when you stand there: ladders, doors, crates, barrels, corpses with their items'
# glow. Checked in the Undead Burg (2026-11-21): all 528 of its objects stay where the map
# puts them (crates and barrels only move once broken, which takes you next to them),
# nothing starts. Costly where many are in view: looking across the Undead Burg with all,
# render thread 4.2 -> 7.2 ms a frame, 5.1 with OcclusionCulling (which skips the hidden
# ones); along the bridge 3.2 -> 3.8. An object of another room lying on a map piece your
# room draws is left out, as the game does from your room (since 2.9.0: the Undead Burg's
# spire towers flickered from the watchtower). false keeps the game's objects. Since 2.8.0.
DrawMapObjects = true

# With DrawMapPieces adjacent or all: the pieces it adds are skipped while something in
# front hides them completely. Most of them are behind walls: at the Demon Ruins bonfire
# all adds Lost Izalith's rooms and nearly none of it shows, and this takes back about half
# of what all costs there (render thread 3.9 -> 3.4 ms a frame; the GPU's time unchanged);
# where the added pieces are few or in view it changes little either way. Each added piece
# is checked every frame with the graphics card's occlusion queries: hidden once its own
# drawing and its bounding box both showed nothing, drawn again as soon as its box shows
# (and every eighth frame regardless, to check). As the camera moves, a piece coming into
# view can appear a frame or two late (with DXVK up to about four); only pieces the game
# itself would not draw at all. The map effects DrawMapPieces adds (torch fire, mist,
# embers of other rooms) are skipped the same way while their boxes are hidden (on the
# Undead Burg bridge with all, 180 -> 205 FPS: none of the 60-odd it adds there shows); the
# game's own effects and those of characters never are. The objects DrawMapObjects adds
# are skipped the same way while hidden. The pieces and objects the game draws from your
# room, characters, shadows and the water's reflection are never skipped.
# false draws every added
# piece. all does the same for every map piece, the game's own too (with any
# DrawMapPieces): most of a room's pieces are behind its own walls as well, but a piece
# near you that comes into view late is easier to see (Ctrl+Shift+O switches between off,
# true and all while playing, in the diagnostics builds such as Prepare to Co-op's).
OcclusionCulling = true

# How far away models switch to their lower levels of detail, in percent of the game's
# distances (100). Remastered raised the usual 15 m and 30 m to 25 m and 50 m, about 167.
LodDistance = 100

# How far away fires keep their full detail, in percent of the game's (100). Torches,
# bonfires, braziers and other fire and area effects (240 effects) drop their embers and other
# small details beyond a few metres; 200 keeps them twice as far, for a little CPU time.
EffectLodDistance = 100

# Grass, flowers, bushes, ivy and leaves sway in the wind, as Remastered added: the same
# plants, the same wind and the same motion. Remastered's models carry each blade's sway in a
# second set of texture coordinates; here it is worked out from each plant's shape as the map
# loads. Strength and speed in percent of Remastered's (100).
FoliageSway = true
FoliageSwayStrength = 100
FoliageSwaySpeed = 100

# The leaves of trees sway too (with FoliageSway): around Firelink Shrine, in the Undead Burg
# and Parish, on the way up to Sen's Fortress and in Anor Londo; trunks and branches stay as
# the game draws them. Remastered does not sway trees; this is a contributed extra, off by
# default. Can be switched at once on the settings page ("Swaying trees").
FoliageTreeSway = false

# Anisotropic filtering for surface textures (floors and walls seen at an angle stay
# sharp): 2, 4, 8 or 16; 0 keeps the game's own filtering. Takes precedence over
# DSfix's filteringOverride; set 0 to leave filtering to DSfix.
AnisotropicFiltering = 16

# Hide the mouse pointer over the game after 2 seconds without moving it; it comes
# back when the mouse moves.
HideMouseCursor = true

# Sun and moon with DSfix's resolution (renderWidth/renderHeight). DSfix 2.x enlarges the
# lens flare's visibility probe without telling the game, so once something passes in
# front of the sun or moon they stay hidden until they leave the screen; this corrects the
# game's expectation. A DSfix that corrects it itself (DSfix 3.0) is recognized the first
# time the game checks the sun or moon, and its correction is left alone; beside this
# mod's RenderResolution, where the problem never arises, DSfix 3.0's correction is undone
# instead (it would leave them faint). Does nothing without DSfix. Safe to leave on with
# every DSfix version.
FixSun = true

# Water with DSfix's dofOverrideResolution set (not 0) while DSfix makes the resolution
# (YieldToDSFix = true, or RenderResolution = off). DSfix enlarges the water's buffer of
# ripples, but the game keeps stepping through it as if it were 512x360, so water surfaces
# break into blocks. DSfix 2.4 as released (2015) has the problem; DSfix built from
# Durante's source since December 2016 corrects it itself, and then this changes
# nothing. Off beside DSfix 3.0 (recognized by its DSfix.ini), which corrects it too.
# Does nothing without DSfix, or with this mod's resolution (see WaterResolution).
# Safe to leave on with every DSfix version.
FixWater = true

# Skip the autosave notice and the Bandai Namco, FromSoftware and Havok logos at
# start-up: the game goes straight on to the title screen. Works whether or not
# FPSUnlock is on. DSfix's own skipIntro (which speeds up the game's clock while it
# sees the logos) is not needed with this on, but does no harm. Set false to see them.
SkipIntro = true

# Give the game 4 GB of address space instead of 2 GB. DARKSOULS.exe is a 32-bit program
# without the "large address aware" flag, so Windows gives it 2 GB; at 4K with DXVK about
# 1.5 GB of that is in use already, and more players in co-op or heavy settings can use up
# the rest (the game then crashes, often in the graphics driver). On the first start
# with this mod the flag is set in DARKSOULS.exe (one byte; the original is kept as
# DARKSOULS.exe.before-laa) and takes effect from the next start. Nothing is changed when
# the game already has 4 GB. Steam's "verify integrity of game files" puts the original
# back; the next start sets the flag again. Set false to leave DARKSOULS.exe as it is.
LargeAddressAware = true

# EXPERIMENTAL (DXVK only). Depth kept in 32-bit float, reversed (far 0, near 1), instead
# of the game's 24 bits. Every vertex shader's depth is mirrored as it is made, the depth
# tests, clears and biases with it; the picture is otherwise the same. The gain at long range
# is small so far: the mirroring comes after the game's own depth math, whose rounding there
# is about as coarse as the 24-bit buffer (2026-11-22: somewhat less distant flicker, not
# none). Needs DXVK = true; off by default.
ReversedDepth = false

# The game ends online play ("Framerate is insufficient for Online play. Returning to
# the Title menu.") when the last 30 seconds averaged 15 FPS or less. One pause of
# about 20 seconds is enough: the game frozen by a slow driver or a debugger, or a
# phone app such as GameNative pausing it while another app is in front. After that
# the title screen keeps the game offline until it is restarted. true leaves this
# check out. Works whether or not FPSUnlock is on. Set false for the game's own check.
FixFramerateKick = true

[Phones]
# Phones and tablets: Android with GameNative or Winlator (and other ARM devices) run
# the game's x86 code translated for their CPU, and heat up quickly at full speed.
# With PhoneProfile = auto, any setting in this file can be given a phone value here:
# its name with "Phone" in front. Those replace the values above only when the game
# runs translated (a PC is never affected). true = always (to try them on a PC),
# false = never.
PhoneProfile = auto
# A phone holds 40 frames per second far longer than it holds 60 before it gets hot
# and slows down (and phones show at most 60 under GameNative).
PhoneMaxFPS = 40
# The game's own scene resolution (1024x720): less work for the phone's graphics chip,
# so it stays cooler and holds the frame rate longer (about 15% more frames when the
# phone is at its limit). auto would draw at the screen size set in GameNative.
PhoneRenderResolution = off
# The game's own shadow map: less for the phone's graphics chip to draw.
PhoneShadowMapResolution = 2048
# More of the world drawn costs a phone's graphics chip, already at its limit: the game's
# own pieces only (see DrawMapPieces).
PhoneDrawMapPieces = game
# The game's own Antialiasing option decides on a phone (anti-aliasing costs its
# graphics chip; this is the phones' default even without this line).
PhoneAntialiasingSamples = game
# Tested on a Snapdragon 888 phone with GameNative: Turnip driver v26.3.0, DXVK
# async-1.10.3 (GameNative's DXVK runs the game there; DXVK = true below does nothing
# under Wine), FEX preset Intermediate, screen 1280x720, present mode mailbox. The FEX
# preset Performance gives about 5% more but checks less.

[DXVK]
# true (the default) = the game's Direct3D 9 runs on Vulkan through DXVK (included as
# dxvk_d3d9.dll; keep it next to xinput1_3.dll). The game's renderer spends most of
# its time in Direct3D 9 calls on one thread, and DXVK spreads that work out: busy
# places run much faster (Blighttown at 4K: 96 FPS on Direct3D 9, 129 with DXVK).
# DSfix keeps working on top of it. Needs a graphics driver with Vulkan 1.3; if DXVK
# cannot start, the game runs on Direct3D 9 as usual and PTDE-FPS-Unlock.log says why.
# The first time an area loads, DXVK compiles shaders (brief hitches, cached afterwards).
# DXVK writes DARKSOULS_d3d9.log in the game folder and reads an optional dxvk.conf from
# there. If the game folder already has a d3d9.dll (DXVK or ReShade installed by hand),
# that one stays in charge and this does nothing. On the Steam Deck and Linux (Proton)
# the game already runs on Proton's own DXVK, so this does nothing there.
# false = DXVK is not loaded at all (the system's Direct3D 9).
# NVIDIA with Windows HDR on: RTX HDR (NVIDIA app) applies to the game only under DXVK,
# never under Direct3D 9, and changes the picture a lot (crushed shadows, brighter
# highlights, other colors). PTDE-FPS-Unlock.log says when it is active; turn it off for
# the game in the NVIDIA app for the same picture as Direct3D 9.
DXVK = true

# How DXVK shows its frames. true (the default) = through DXGI, the way Direct3D 11 and
# 12 games (and Direct3D 9 itself) do: Windows HDR stays on with the same picture as
# Direct3D 9, and G-SYNC / FreeSync works in fullscreen and borderless windows alike,
# without exclusive fullscreen. It needs a graphics driver that shares textures between
# Direct3D 11 and Vulkan (current NVIDIA, AMD and Intel drivers do); if it cannot, the
# log says so and DXVK shows its frames itself. false = DXVK's own Vulkan presentation
# (then DxvkExclusiveFullscreen below decides about variable refresh).
DxvkPresentThroughDxgi = true

# Only with DxvkPresentThroughDxgi = true. true (the default) = each frame is shown a
# steady delay after the moment the game made it, so the frames reach the display
# spaced exactly like the game's own time steps: with G-SYNC / FreeSync the refresh rate
# stays steady and turning the camera is smooth, as on Direct3D 9. Under DXVK a frame
# takes a different time each frame to get through, and shown the moment it was done
# the frames went out up to 1-2 ms early or late (the refresh rate wandering, uneven
# motion). The delay follows how long frames take (about a frame), and under a MaxFPS at
# or below the display's refresh rate no two frames go out closer together than the
# display's fastest refresh. false = frames go out the moment the graphics card
# finishes them. With Profile = true the log says how far the frames were off the
# game's steps. Together with EvenFrameSteps and a MaxFPS your PC holds (see MaxFPS
# above), the display refreshes as evenly as on Direct3D 9.
DxvkPacedPresent = true

# Only with DxvkPresentThroughDxgi = true, on a display Windows runs in HDR. true = the
# frames go to the display in 16-bit scRGB, hdr10 = in 10-bit HDR10, each converted as
# Windows shows an SDR game in HDR (the same picture). Tests on an HDR display with
# G-SYNC showed no difference in frame pacing, so it is left off. false (the default) =
# 8-bit frames, which Windows converts itself.
DxvkHdrSwapChain = false

# Only with DxvkPresentThroughDxgi = false. Under DXVK in fullscreen, let DXVK take
# exclusive fullscreen. G-SYNC / FreeSync
# (variable refresh) only works under DXVK with it. But with Windows HDR on, Windows
# switches HDR off for as long as the game holds exclusive fullscreen: the monitor
# changes mode and the picture looks different. (Direct3D 9 gets variable refresh and
# keeps HDR on.)
# auto = only while Windows HDR is off for the display (the default)
# true = always (with HDR on: variable refresh, but HDR is off while you play)
# false = never: DXVK presents to a fullscreen window (no variable refresh)
# Has no effect without DXVK or in windowed mode.
DxvkExclusiveFullscreen = auto

# =======================================================================================
# Fixes and speed-ups: leave these as they are.
# Everything below is on (or set) the way the mod is meant to be played. Turning a fix
# off brings back the original game's problem at a high frame rate; turning a speed-up
# off only makes the game slower. They are here to compare with the original game, or
# to try when asked to while troubleshooting.
# =======================================================================================

[Framerate]
# Master switch for the whole mod. Set false to turn every part of it off and leave
# the game unchanged (to check whether a problem comes from the mod), except SkipIntro
# above, which has its own switch.
FPSUnlock = true

# Where the frame rate cap waits. early waits at the start of the frame, before the game
# reads the controller, keyboard or mouse: the least input lag. present waits just
# before the picture is shown, after that input has been read: the most even frame
# timing, with slightly more input lag. Only the named one waits. Restart the game
# after changing it.
FPSLimitPoint = early

# Only with FPSLimitPoint = early and a MaxFPS cap. true (the default) = a frame that
# keeps to the cap advances the game by exactly the cap's step (at 120, 8.33 ms every
# frame) instead of the time measured on the render thread, which also carries how long
# the game's update took and so wandered a millisecond or two either side. Motion stays
# even, and with G-SYNC / FreeSync the display's refresh rate stays steady. A frame that
# falls more than half a step behind advances by the time it really took.
EvenFrameSteps = true

# Write the measured frame time into the game's fixed 1/30 step each frame, so game
# speed stays correct at any frame rate and when the frame rate drops. Set false to
# only observe (log the survey) without changing anything.
VariableFrameTime = true

# Stop the render thread waiting two vertical blanks per frame (the 30 FPS lock),
# the same change DSfix makes.
VblankPatch = true

# The game re-presents a frame in a catch-up loop until the display's vblank counter
# reaches its 30 FPS schedule. Set true to skip that loop (experimental; try this if
# a variable-refresh display bounces between refresh rates).
SkipPresentRepeat = false

[Controller]
# The game only accepts four controller ids from Windows 7. A current pad, the Steam
# Deck, or a second device (a wheel, a virtual pad, another controller) often means
# the game never reads the pad you are holding, or drops it after a brief disconnect.
# On keeps an id when it matches, and otherwise uses a real gamepad: the one you are
# holding if several are connected, otherwise the first. Wheels, flight sticks and
# music controllers stay on the game's own path. false leaves that choice to the game.
FixController = true

[Steam]
# On Windows the Steam client checks Wi-Fi about every 5 seconds on the thread that
# answers games, and every Steam call the game makes in that moment waits for it (15 ms
# on a PC with Wi-Fi). The game asks Steam for news every frame, so above 60 FPS that is
# a small hitch every 5 seconds (with Steam offline too). On lets the game's
# every-frame Steam calls go only right after Steam has answered quickly (a small
# thread asks it the time; only on a PC where Steam has paused in the last minute),
# and sends the game's online packets from a thread of their own. Not needed on the
# Steam Deck.
SteamPauseGuard = true

[Physics]
# Several movement systems were written for exactly 30 frames a second and count
# once per frame instead of per second. Each fix below scales one of them with the
# frame time. At exactly 30 FPS every fix changes nothing.

# Slope gravity and ground friction of the movement controller.
FixSlide = true

# Airborne horizontal momentum (jump distance, walk-off momentum), and how far
# ground-crawling projectiles slide (the undead dragon's acid).
FixDamping = true

# The walk-speed check that slows the character when its per-frame movement is small
# (grazing a wall, or simply running at a high frame rate).
FixGraze = true

# Per-frame 1/30 second timers: the weapon buff glow fading in and out, the ragdoll
# blend-in, the glow on dropped items, a few countdowns, and the interval between
# volleys of repeating projectiles (breath and spit attacks).
FixTimers = true

# The follow camera's pivot and look-at point ease toward their targets by 1/30 of the
# gap a frame.
FixSmoothing = true

# Velocities the game works out from one frame's movement, assuming 30 frames a second:
# the powered ragdoll that pulls a body toward a pose, and the speed of moving sounds
# that FMOD uses for the Doppler pitch shift (too weak at a high frame rate, too strong
# at a low one).
FixVelocity = true

# Enemy AI scripts clear out their used memory at least as often as at 30 FPS (every
# 15 frames). The game does it on a half-second timer while the scripts use up memory
# every frame, so at a high frame rate many times as much built up between clean-ups,
# and in a crowded area the script memory could run out and the game close itself.
FixScriptMemory = true

# Keeps the ground snap-down at the retail rate per second: the downward pull onto
# the ground after stepping off a ledge or lip, and at the bottom of a ladder slide.
# (Earlier builds called this FixLadder; that name still works.)
FixStepDown = true

# Lips and ledges a little higher than a normal step are climbed as at 30 FPS. The game
# lifts the character by its step height each frame, moves it, and puts it back down; a
# lip just above that height is climbed by creeping up its edge, which the shorter frames
# of a high frame rate could not do (the Great Hollow's Chloranthy Ring hollow could not
# be left at 120 FPS). A character pushing against something without moving is now moved
# as at 30 FPS: every 1/30 s its frames are moved again as one. At 30 FPS and below
# nothing changes.
FixStepUp = true

# Ladder slides take as long as at 30 FPS. A slide is a chain of short animations, and
# each one costs a frame that moves nothing before the next starts, so at a high frame
# rate the slide went faster (3.75 m/s at 30 FPS, 4.8 m/s at 240). The segments now play
# a little slower, smoothly. At 30 FPS and below nothing changes.
FixLadderSlide = true

# Lock-on camera: switching targets and locking onto an enemy near the edge of the
# screen take the same time at any frame rate instead of snapping.
FixCamera = true

# Lock-on body turn: the torso, head and hips turn to face the locked-on target at
# the original speed instead of snapping round at a high frame rate.
FixLockOnTurn = true

# Foot IK: the feet placed on stairs and slopes, and the hips lowered so both feet
# reach, at the original speed. The hips followed each step of a staircase several
# times faster at a high frame rate, so running up or down stairs and slopes bobbed.
FixFootIk = true

# Foot IK for NPCs: human NPCs (Solaire, the merchants, invading spirits, summoned
# phantoms) place their feet on stairs, slopes and roofs and lower their hips to reach,
# as your own character does. The game placed the feet of your character only; everyone
# else kept the animation's feet for flat ground, so on uneven ground their feet floated
# above it or sank into it. Enemies have no foot placement and are not changed. Costs
# about 14 microseconds of the game's CPU time a frame for each human NPC the game moves
# every frame (those near you; seven side by side added 0.1 ms and no change in the frame
# rate on a Ryzen 7 5800X3D).
# Prepare to Co-op does the same for the other players (FootIkPlayers).
FootIkNpcs = true

# Bloodstain and wandering ghost replays play at the original speed, and your own
# replay data (bloodstains, ghost data sent to other players) is recorded in real
# time instead of once every few frames. Ghosts move evenly between samples, and
# ghosts and other players' characters turn at the original speed instead of
# overshooting and snapping back.
FixGhosts = true

# Particle effects (smoke, sparks, embers, magic) spawn as densely as at 30 FPS. Many
# emitters spawn once per frame, so at 120 FPS they came out up to four times as thick.
# Uses Remastered's own fix, spawn intervals below 1/30 s become 1/30 s as effects load,
# set a hair under 1/30 s: exactly 1/30 s missed frames that came a fraction of a
# millisecond early, and up to 2.4.1 it thinned these effects by about a quarter at 30
# and 60 FPS.
FixSfxSpawnRate = true

# Effects that start a part one frame after another part see the same time a 30 FPS frame
# gives them. Without it the undead dragon's acid never shows on the ground above 30 FPS.
FixSfxActions = true

# Heat haze (Quelaag's lava, fire) rolls like a wave as at 30 FPS. Its pattern moves in
# real time, which at 30 FPS is a tenth of the pattern each frame; at higher frame rates
# that was drawn so finely it looked like shaking. Now it steps 30 times a second.
FixSfxDistortion = true

# Swaying effect particles (such as the fire of the Blighttown spider offspring's magma
# tentacle) change direction as often as at 30 FPS. They turned every few frames (every 5
# in most effects, 20 in the tentacle), so at 240 FPS eight times as often, and the
# tentacle's flames trailed far behind it instead of staying on its body.
FixSfxSway = true

# Effect trails (the ribbons behind sorceries, projectiles and some enemy attacks) keep
# their length above 60 FPS. A trail holds a fixed number of points, enough for one a
# frame at 60 FPS, and most trails took a point every frame, so at 240 FPS they were cut
# to about a quarter of their length. Now a trail takes a point every 1/60 s if its points
# then still cover its lifetime, else every 1/30 s as at 30 FPS (about half of the
# trails, the short ones, then also take a point every other frame at 60 FPS).
FixSfxTrails = true

# HUD: the health/stamina/boss bars fill at the original speed (Estus no longer snaps the
# bar full in a fraction of a second) and the loading screen's bonfire swirl turns at its
# original speed.
FixUI = true

# After "Reverse hollowing" at a bonfire the character can stay seated with no menu and no
# way to stand (an unlocked frame rate makes it likely). When that state lasts a second the
# character is told to stand up; after the Reverse Hollowing or Kindle prompt, not before 8
# seconds after it (both take about 6 with the menu closed). The idea and addresses come from FPSFix+ by Sean Pesce.
BonfireUnstick = true

# Sprinting takes one stamina point every 0.1 s. The game rounded each tick up to a whole
# frame and dropped the remainder, so at frame rates that do not divide 0.1 s evenly the
# drain ran slower than intended (about 13% at 62 FPS). true keeps the remainder:
# 10 points a second at any frame rate.
FixStaminaTick = true

# Steep slides (the slopes before the Bed of Chaos, and others). The game records
# "feet on the slide" once a frame. At a high frame rate that record can miss for a
# single frame at the lip, and the slide animation cancels. The record is kept for
# 1/30 s after the last real contact. At 30 FPS the next frame is already that long,
# so it drops as in the game.
FixSlideContact = true

# Steering on a slide. The turn animation restarts every frame, so its only live
# layer is one frame old. Havok then throws out the root motion, and the legs move
# while the body barely does. The threshold follows the frame time. At 30 FPS and
# below it is unchanged.
FixSlideSteer = true

# In-engine cutscene cameras. The characters already move every frame; the camera
# used to hold each 30 FPS key and then jump. It is blended between those keys. A
# real cut still snaps, and pre-rendered movies are unchanged.
FixCutsceneCamera = true

# The soul counter on the HUD. It added its whole step once a frame, so a large
# pickup finished several times too fast at a high frame rate. The step follows the
# frame time. A hitch adds at most four of the game's steps.
FixSoulCounter = true

# Kick (forward + R1) and jumping attack (forward + R2). The game only takes a push
# of the stick as a flick if it gets from neutral past the threshold between two
# frames, and a press only counts with it if both land in the same frame. At a high
# frame rate a frame is much shorter, so kicks and jumping attacks often came out as
# plain attacks. Both tests follow the original game's 30 FPS frames in real time.
FixStickFlick = true

# Roll direction. The game remembers the stick for its last 5 frames and rolls the way
# it was pushed, even if it was let go just before the roll button. That is 0.13 s at
# 30 FPS but only 0.02 s at 240, so a push let go of a moment early came out as a
# backstep (or nothing). The memory covers the original game's 5 frames of 1/30 s.
FixRollDirection = true

# Switchback. Reversing the stick while running or sprinting plays a quick turn-around
# animation when the stick's direction swings more than 105 degrees within one frame.
# At a high frame rate a frame is so short that the swing almost never fits in one, so
# the switchback rarely played. The swing is measured over the original game's 30 FPS
# frames in real time.
FixSwitchback = true

# Status build-up from the ground and other effects that are kept up by being applied
# again and again (Blighttown's swamp: poison). An effect's time is counted down by
# whole frames, and the next one only comes once the game has seen the old one run out,
# so at a high frame rate the swamp poisoned up to half again as fast (45 points a
# second at 240 FPS instead of 30). Effects run out on the original game's 30 FPS
# frames in real time. The same for effects that act at intervals (lava, heals and
# damage over time): they act as often as in the original game at any frame rate (a
# 0.1 s effect acted up to 18% less often, also at 30 FPS with this mod, a 0.2 s one
# up to 17% more often).
FixSpEffectTiming = true

# Lingering attacks that hit again while you stand in them (the clouds of Poison Mist
# and Toxic Mist, Acid Surge, Vow of Silence, Chaos Storm, enemy multi-hit attacks).
# After a hit the target is left alone for the attack's re-hit time, counted down by
# whole frames, so at a high frame rate those areas hit more often (Toxic Mist 17% more
# often at 240 FPS). The re-hit time runs out on the original game's 30 FPS frames in
# real time.
FixBulletHitTiming = true

# Scripted sequences (the waits in the game's event scripts: a trap's rhythm, an enemy's
# scripted attack, a door, a boss's entrance). A wait is counted down by whole frames,
# and in the original game at 30 FPS rounding leaves most of them a frame long (0.5 s
# lasts 0.533 s); at a higher frame rate they end up to that frame (33 ms) sooner. Mostly
# unnoticeable, but the Undead Burg's barrel thrower was hit by his own barrel above
# 30 FPS. Each wait ends on the frame nearest to where the original game's does.
FixEventWaits = true

[Renderer]
# The game applies Options > Brightness in fullscreen as a gamma ramp (at the default
# brightness the ramp changes nothing). Direct3D 9 and DXVK both apply it, with HDR on too.
# true = the ramp is applied (the default; auto means the same)
# false = the ramp is never applied (the Brightness option has no effect)
GammaRamp = true

# The render thread (the game's Direct3D work) limits the frame rate in busy places.
# These take work off it without changing the picture.
#
# Once a frame the game copies a small render target (the scene's brightness, for the
# eye adaptation) back to the CPU and waits for the GPU to finish everything before it
# (up to a millisecond at 4K, and the GPU then sits idle while the game catches up).
# true = the copy is taken from two frames earlier, which is ready, so nothing waits
# (the eye adaptation, which takes about a second, starts two frames later).
AsyncReadback = true

# The game sets six sampler states for every texture it uses, about 17,000 calls a
# frame, nearly all repeating what is already set. true = a call that repeats the
# current value does not reach Direct3D.
FilterSamplerStates = true

# The same for vertex shader constants: a value that repeats what is already set does not
# reach Direct3D. Off: the game rarely repeats them (under 1%), so checking costs more than
# it saves. Kept for testing.
FilterShaderConstants = false

# In some maps (Blighttown) the game draws the whole scene a second time, small and
# mirrored, for mirroring surfaces, every frame, also when nothing on screen shows
# one: a quarter of all draws in a heavy Blighttown view, where nothing uses it.
# true = it is not drawn while nothing on screen reads it (about 4% more frames there),
# and drawn again from the frame after something does (that one frame shows the last
# mirror image that was drawn). Often the surfaces that read it are drawn but hidden
# behind something (on the Undead Burg bridge an object at the far end of the deck and the
# distant sea, in Blighttown water behind the walls): since 2.8.0 each draw that reads it
# is counted with an occlusion query, and while they all come back hidden it is not drawn
# either (Undead Burg bridge 319 -> 341 FPS; 203 -> 237 with DrawMapPieces all). One that
# comes into view shows the last mirror image for the frame or few the answer takes
# (redrawn every 8th frame meanwhile). The picture is the same. Off while DSfix is loaded.
SkipUnusedReflection = true

# The game creates five depth buffers and one small surface every frame and throws them
# away again. true = they are kept and handed out again. Cheap under Direct3D 9 either
# way; under DXVK each new one costs real time (about 9% of the renderer in Blighttown).
ReuseSurfaces = true

# The game's reader/writer locks (taken hundreds of times a frame, and tens of thousands
# of times when an area streams in) make two to six calls into the Windows kernel each.
# true = they are taken and given back without kernel calls (the same rules), except
# where the game's x86 code is translated for another CPU (Android with GameNative or
# Winlator, Windows on ARM); always = there too.
FastReadLocks = true

# The game's mutexes (taken a few hundred times a frame, by the game thread among others)
# make a call into the Windows kernel every time they are taken and every time they are
# given back. true = without kernel calls (the same rules: the thread holding one can take
# it again, a thread that has to wait sleeps), except where the game's x86 code is
# translated for another CPU; always = there too.
FastMutexes = true

# Textures are sent to the graphics card while the game loads them, instead of the first
# time something is drawn with them, which happened mid-frame on the render thread as an
# area streamed in (part of the hitches on entering an area).
PreloadTextures = true

# The game's loader asks Windows what kind of drive (hard disk, DVD, network) every file
# it loads is on, while it holds locks the game itself waits for. On Windows that is
# quick; under Wine (Android with GameNative or Winlator, Linux and the Steam Deck with
# Proton) the answer comes from another process and can take a long time: on a phone
# it froze the game for up to half a second at a time after loading screens and while
# new areas streamed in. true = asked once per drive and remembered. Works whether or
# not FPSUnlock is on.
CacheDriveType = true

# The game reads the keyboard and the mouse four times a frame, once for each of its
# four input users. Under Wine every read also has Wine look for new input events, which
# on a phone took about 2.5 ms of every frame; on Windows the four reads are quick, but
# where the game thread is the limit, reading once is still about 2% more frames.
# true or auto (the default) = each is read once a frame and the game's other three
# readers get that same reading (nothing else changes); false = the game's own four reads.
# Before 2.6.0, auto meant true only under Wine (phones, Linux, the Steam Deck).
CacheInputReads = auto

# The game's effects library (particles: fog, fire, sparks, the dragons' acid) was
# shipped as a debug build: every one of its functions fills its memory with a test
# pattern on entry and checks it on exit, and every small step copies its result
# through the stack two or three times. Views with many particles are slow out of
# proportion to what they show (the Darkroot tunnel toward the elevator). true = those
# checks are skipped and the busiest routines (keyframe curves, colour packing, the
# per-particle loops and the like) run as direct code; the effects look and behave the same.
FastEffects = true

# Small math routines the game's renderer and effects call tens of thousands of times a
# frame (adding, subtracting and multiplying four numbers at once, adding two matrices,
# handing animated models' bones to the graphics card, transforming bounding boxes) run
# as faster code with exactly the same results.
FastRenderMath = true

# How exactly FastRenderMath keeps the original arithmetic on the render thread (the
# thread that hands each frame's drawing to the graphics card; nothing it works out
# goes back into the game). exact: every result identical to the original game's.
# relaxed: its matrix multiplies and multiply-adds round once in float instead of
# through double, as a modern compiler would build them: about a quarter of those
# results differ in the last binary digit, far below what a pixel can show, for a few
# percent less render work in busy views. The game's own logic (physics, AI, hits) is
# always exact.
RenderMathPrecision = relaxed

[Diagnostics]
# Development only. Leave these off for normal play.

# Log a per-second frame and command summary for this many seconds after start.
# 0 = off.
Survey = 0

# Performance: a [perf] line every 5 seconds (frames per second, the game thread's update
# and the render thread's frame times, how busy both threads are, Direct3D calls per
# frame, your position). Press F10 in a slow scene to sample every busy thread for 10
# seconds and log which code the time goes to.
Profile = false

# Development only: commands from fpsu-cmd.txt beside the game (screenshots, frame logs,
# controller input, frame rate), results in fpsu-remote.txt.
RemoteControl = false

# Development only: RemoteControl commands run once at the start, separated by ";"
# (tests on machines where fpsu-cmd.txt is hard to write, such as the Steam Deck).
RemoteControlStartup =

# Development only: reads the primary display's refreshes (one CPU core busy) and logs,
# with Profile = true, how evenly the display refreshed and how soon after each frame.
# Keys while playing: Ctrl+Shift+U logs the HUD and menu draws, Ctrl+Shift+P switches
# how DXVK's frames go out (a mark in the top right corner: green timed, red when the
# graphics card is done, yellow when ready), Ctrl+Shift+H switches DxvkHdrSwapChain
# (second mark: blue on, grey off).
ScanWatch = false

# With Trace = true: F4/F5/F6/F7 switch the frame rate live to 30/60/120/240 FPS,
# F9 records the player's state to PTDE-FPS-Unlock-trace-N.csv and F11 records the
# player's object graph to PTDE-FPS-Unlock-deep-N.csv (both large), and Ctrl+1 to
# Ctrl+7, Ctrl+9 and Ctrl+0 toggle the fixes above (1 slide, 2 damping, 3 timers,
# 4 smoothing, 5 graze, 6 step down, 7 camera, 9 lock-on turn, 0 foot IK).
Trace = false

# Log the dragons' acid and the pool it leaves ([bullet] lines): the Valley of Drakes
# undead dragon and the Gaping Dragon. For the pool that does not show above 30 FPS.
BulletTrace = false

# An effect id: the code that reads its first emitter timing block is logged (SfxWatch lines),
# to check FixSfxSpawnRate. 16012 is the undead dragon's acid. 0 = off.
SfxWatch = 0

# Log the HUD shortcut actions (D-pad item and weapon cycling) with timestamps, to
# diagnose repeat speed. Hold the D-pad for a few seconds, then read the [input] lines.
InputLog = false

# Hash every vertex shader constant upload to count presents whose content did not
# change (logged with the Survey). Costs CPU every frame.
ContentProbe = false

# Hardware write watchpoints on player fields (F8 arms and reports), for example
# "p:180,c:1B8". Leave empty.
Watch =
