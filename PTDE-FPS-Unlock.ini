# PTDE-FPS-Unlock (development build)
# Place xinput1_3.dll and this file next to DARKSOULS.exe. It loads alongside DSfix
# (which uses DINPUT8.dll); the two do not share a file name.
#
# This build only observes the game and writes PTDE-FPS-Unlock.log. It does not
# change the game yet.
#
# If you use DSfix, set "unlockFPS 0" in DSfix.ini once this mod starts driving the
# frame rate, so the two do not fight over the same timestep.

[Framerate]
# Set false to leave the game completely unchanged.
FPSUnlock = true

# Frames per second to aim for. The game runs at 30 natively. 31 through 1000.
TargetFPS = 60
