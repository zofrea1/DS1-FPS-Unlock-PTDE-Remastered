# PTDE-FPS-Unlock  v2.1.0  (Dark Souls: Prepare to Die Edition)
# Place xinput1_3.dll and this file next to DARKSOULS.exe. It loads alongside DSfix
# (which uses DINPUT8.dll); the two do not share a file name.
# Recommended: exclusive fullscreen (best monitor, frame pacing and VRR compatibility).
# Only the current Steam build of the game is supported (see the README).
#
# This mod drives the frame rate. If you use DSfix, set "unlockFPS 0" in DSfix.ini
# so the two do not both write the same timestep. (If it is left on, this mod still
# wins, because it writes after DSfix each frame.)

[Framerate]
# Master switch for the whole mod. Set false to turn every part of it off and leave
# the game unchanged, except SkipIntro below, which has its own switch.
FPSUnlock = true

# Frame rate cap, 10 through 1000 (a value outside that range is clamped to the
# nearest end). The game runs in real time at any frame rate from 1000 down to 10,
# so this only limits how fast frames are drawn. Pick what your PC can hold, or
# a lower cap such as 30 (the original frame rate) for steady frame pacing.
# (Earlier builds called this TargetFPS; that name still works.)
MaxFPS = 120

# Where that cap waits. early waits at the start of the frame, before the game
# reads the controller, keyboard or mouse: the least input lag. present waits just
# before the picture is shown, after that input has been read: the most even frame
# timing, with slightly more input lag. Only the named one waits. Restart the game
# after changing it.
FPSLimitPoint = early

# Write the measured frame time into the game's fixed 1/30 step each frame, so game
# speed stays correct at any frame rate and when the frame rate drops. Set false to
# only observe (log the survey) without changing anything.
VariableFrameTime = true

# Stop the render thread waiting two vertical blanks per frame (the 30 FPS lock),
# the same change DSfix makes.
VblankPatch = true

# Exclusive fullscreen refresh rate. The game only offers 59/60 Hz. -1 leaves the
# game's choice alone, 0 picks the highest rate the display supports at the game's
# resolution, N asks for N Hz (falling back to the highest below it). Applies only
# when the game is in true fullscreen, not windowed or BorderlessFullscreen.
FullscreenRefreshRate = 0

# Borderless fullscreen: strips the window frame and stretches the window over its
# monitor. Set the game to WINDOWED mode in its display settings first. This avoids
# exclusive fullscreen, where the game always picks 60 Hz; the display then runs at
# the desktop refresh rate. Skipped if DSfix's own borderlessFullscreen is on.
BorderlessFullscreen = false

# Fill a screen taller than 16:9, such as the Steam Deck's 1280x800. The game
# otherwise keeps a 16:9 picture and leaves the extra height black. The horizontal
# view stays the same; the extra height shows more of the world. A 16:9 display is
# unchanged, and the in-game list does not need a 16:10 option. Leave DSfix
# presentWidth and presentHeight at 0 so this can choose the size. The HUD, menus and
# movies are made for 16:9 and are stretched a little to fill the screen. false keeps
# the bars.
FixAspect = true

# The game re-presents a frame in a catch-up loop until the display's vblank counter
# reaches its 30 FPS schedule. Set true to skip that loop (experimental; try this if
# a variable-refresh display bounces between refresh rates).
SkipPresentRepeat = false

[Startup]
# Skip the autosave notice and the Bandai Namco, FromSoftware and Havok logos at
# start-up: the game goes straight on to the title screen. Works whether or not
# FPSUnlock is on. DSfix's own skipIntro (which speeds up the game's clock while it
# sees the logos) is not needed with this on, but does no harm. Set false to see them.
SkipIntro = true

[Controller]
# The game only accepts four controller ids from Windows 7. A current pad, the Steam
# Deck, or a second device (a wheel, a virtual pad, another controller) often means
# the game never reads the pad you are holding, or drops it after a brief disconnect.
# On keeps an id when it matches, and otherwise uses a real gamepad: the one you are
# holding if several are connected, otherwise the first. Wheels, flight sticks and
# music controllers stay on the game's own path. false leaves that choice to the game.
FixController = true

[Physics]
# Several movement systems were written for exactly 30 frames a second and count
# once per frame instead of per second. Each fix below scales one of them with the
# frame time. At exactly 30 FPS every fix changes nothing. Set one to false to
# compare.

# Slope gravity and ground friction of the movement controller.
FixSlide = true

# Airborne horizontal momentum (jump distance, walk-off momentum), and how far
# ground-crawling projectiles slide (the undead dragon's acid).
FixDamping = true

# The walk-speed check that slows the character when its per-frame movement is small
# (grazing a wall, or simply running at a high frame rate).
FixGraze = true

# Per-frame 1/30 second timers: the weapon buff glow fading in and out, the ragdoll
# blend-in, the glow on dropped items, a few countdowns, and the interval between
# volleys of repeating projectiles (breath and spit attacks).
FixTimers = true

# The follow camera's pivot and look-at point ease toward their targets by 1/30 of the
# gap a frame.
FixSmoothing = true

# Velocities the game works out from one frame's movement, assuming 30 frames a second:
# the powered ragdoll that pulls a body toward a pose, and the speed of moving sounds
# that FMOD uses for the Doppler pitch shift (too weak at a high frame rate, too strong
# at a low one).
FixVelocity = true

# Enemy AI scripts clear out their used memory at least as often as at 30 FPS (every
# 15 frames). The game does it on a half-second timer while the scripts use up memory
# every frame, so at a high frame rate many times as much built up between clean-ups,
# and in a crowded area the script memory could run out and the game close itself.
FixScriptMemory = true

# Keeps the ground snap-down at the retail rate per second: the downward pull onto
# the ground after stepping off a ledge or lip, and at the bottom of a ladder slide.
# (Earlier builds called this FixLadder; that name still works.)
FixStepDown = true

# Lock-on camera: switching targets and locking onto an enemy near the edge of the
# screen take the same time at any frame rate instead of snapping.
FixCamera = true

# Lock-on body turn: the torso, head and hips turn to face the locked-on target at
# the original speed instead of snapping round at a high frame rate.
FixLockOnTurn = true

# Foot IK: the feet placed on stairs and slopes, and the hips lowered so both feet
# reach, at the original speed. The hips followed each step of a staircase several
# times faster at a high frame rate, so running up or down stairs and slopes bobbed.
FixFootIk = true

# Bloodstain and wandering ghost replays play at the original speed, and your own
# replay data (bloodstains, ghost data sent to other players) is recorded in real
# time instead of once every few frames. Ghosts move evenly between samples, and
# ghosts and other players' characters turn at the original speed instead of
# overshooting and snapping back.
FixGhosts = true

# Particle effects (smoke, sparks, embers, magic) spawn as densely as at 30 FPS. Many
# emitters spawn once per frame, so at 120 FPS they came out up to four times as thick.
# Uses Remastered's own fix: spawn intervals below 1/30 s become 1/30 s as effects load.
FixSfxSpawnRate = true

# Effects that start a part one frame after another part see the same time a 30 FPS frame
# gives them. Without it the undead dragon's acid never shows on the ground above 30 FPS.
FixSfxActions = true

# HUD: the health/stamina/boss bars fill at the original speed (Estus no longer snaps the
# bar full in a fraction of a second) and the loading screen's bonfire swirl turns at its
# original speed.
FixUI = true

# After "Reverse hollowing" at a bonfire the character can stay seated with no menu and no
# way to stand (an unlocked frame rate makes it likely). When that state lasts a second the
# character is told to stand up. The idea and addresses come from FPSFix+ by Sean Pesce.
BonfireUnstick = true

# Sprinting takes one stamina point every 0.1 s. The game rounded each tick up to a whole
# frame and dropped the remainder, so at frame rates that do not divide 0.1 s evenly the
# drain ran slower than intended (about 13% at 62 FPS). true keeps the remainder:
# 10 points a second at any frame rate.
FixStaminaTick = true

# Steep slides (the slopes before the Bed of Chaos, and others). The game records
# "feet on the slide" once a frame. At a high frame rate that record can miss for a
# single frame at the lip, and the slide animation cancels. The record is kept for
# 1/30 s after the last real contact. At 30 FPS the next frame is already that long,
# so it drops as in the game.
FixSlideContact = true

# Steering on a slide. The turn animation restarts every frame, so its only live
# layer is one frame old. Havok then throws out the root motion, and the legs move
# while the body barely does. The threshold follows the frame time. At 30 FPS and
# below it is unchanged.
FixSlideSteer = true

# In-engine cutscene cameras. The characters already move every frame; the camera
# used to hold each 30 FPS key and then jump. It is blended between those keys. A
# real cut still snaps, and pre-rendered movies are unchanged.
FixCutsceneCamera = true

# The soul counter on the HUD. It added its whole step once a frame, so a large
# pickup finished several times too fast at a high frame rate. The step follows the
# frame time. A hitch adds at most four of the game's steps.
FixSoulCounter = true

# Kick (forward + R1) and jumping attack (forward + R2). The game only takes a push
# of the stick as a flick if it gets from neutral past the threshold between two
# frames, and a press only counts with it if both land in the same frame. At a high
# frame rate a frame is much shorter, so kicks and jumping attacks often came out as
# plain attacks. Both tests follow the original game's 30 FPS frames in real time.
FixStickFlick = true

# Roll direction. The game remembers the stick for its last 5 frames and rolls the way
# it was pushed, even if it was let go just before the roll button. That is 0.13 s at
# 30 FPS but only 0.02 s at 240, so a push let go of a moment early came out as a
# backstep (or nothing). The memory covers the original game's 5 frames of 1/30 s.
FixRollDirection = true

# Switchback. Reversing the stick while running or sprinting plays a quick turn-around
# animation when the stick's direction swings more than 105 degrees within one frame.
# At a high frame rate a frame is so short that the swing almost never fits in one, so
# the switchback rarely played. The swing is measured over the original game's 30 FPS
# frames in real time.
FixSwitchback = true

# Status build-up from the ground and other effects that are kept up by being applied
# again and again (Blighttown's swamp: poison). An effect's time is counted down by
# whole frames, and the next one only comes once the game has seen the old one run out,
# so at a high frame rate the swamp poisoned up to half again as fast (45 points a
# second at 240 FPS instead of 30). Effects run out on the original game's 30 FPS
# frames in real time.
FixSpEffectTiming = true

# Lingering attacks that hit again while you stand in them (the clouds of Poison Mist
# and Toxic Mist, Acid Surge, Vow of Silence, Chaos Storm, enemy multi-hit attacks).
# After a hit the target is left alone for the attack's re-hit time, counted down by
# whole frames, so at a high frame rate those areas hit more often (Toxic Mist 17% more
# often at 240 FPS). The re-hit time runs out on the original game's 30 FPS frames in
# real time.
FixBulletHitTiming = true

[Renderer]
# EXPERIMENTAL. Run the game's Direct3D 9 on Vulkan through DXVK (included as
# dxvk_d3d9.dll; keep it next to xinput1_3.dll). It may or may not improve the frame
# rate on your system, and it can have other issues, such as wrong colors, crushed
# blacks or an inaccurate gamma curve. DSfix keeps working on top of it. Needs a
# graphics driver with Vulkan 1.3; if DXVK cannot start, the game runs on Direct3D 9
# as usual and PTDE-FPS-Unlock.log says why. The first time an area loads, DXVK
# compiles shaders (brief hitches, cached afterwards). DXVK writes DARKSOULS_d3d9.log
# in the game folder and reads an optional dxvk.conf from there. If the game folder
# already has a d3d9.dll (DXVK or ReShade installed by hand), that one stays in charge
# and this does nothing. false (the default) = DXVK is not loaded at all.
DXVK = false

# The game applies Options > Brightness in fullscreen as a gamma ramp (at the default
# brightness the ramp changes nothing). While Windows runs the display in HDR (or Auto
# Color Management), Windows ignores gamma ramps, so under Direct3D 9 the Brightness
# option has no effect there; DXVK applies the ramp itself in any display mode.
# auto = under DXVK the ramp is left out while the display is in HDR or Auto Color
#        Management, so the picture matches Direct3D 9 (the default)
# true = the ramp is always applied when Direct3D does (DXVK: also in HDR)
# false = the ramp is never applied (the brightness option has no effect)
GammaRamp = auto

# With Windows HDR on, DXVK shows darker shadows than Direct3D 9 (crushed blacks): the
# frames are the same, but they reach the screen through a plain gamma curve instead of
# Windows' sRGB curve. This makes up for it through DXVK's gamma ramp. The number is the
# gamma to make up for: 2.2 (the default), 2.4 if shadows still look too dark, 0 = off.
# No effect under Direct3D 9, with HDR off, or in windowed mode.
DxvkHdrGamma = 2.2

# The render thread (the game's Direct3D work) limits the frame rate in busy places.
# These two take work off it without changing the picture.
#
# Once a frame the game copies a small render target back to the CPU and waits for the
# GPU to finish everything before it (up to a millisecond at 4K, and the GPU then sits
# idle while the game catches up). true = the copy is taken from two frames earlier,
# which is ready, so nothing waits.
AsyncReadback = true

# The game sets six sampler states for every texture it uses, about 17,000 calls a
# frame, nearly all repeating what is already set. true = a call that repeats the
# current value does not reach Direct3D.
FilterSamplerStates = true

# The same for vertex shader constants: a value that repeats what is already set does not
# reach Direct3D. Off: the game rarely repeats them (under 1%), so checking costs more than
# it saves. Kept for testing.
FilterShaderConstants = false

# The game creates five depth buffers and one small surface every frame and throws them
# away again. true = they are kept and handed out again. Cheap under Direct3D 9 either
# way; under DXVK each new one costs real time (about 9% of the renderer in Blighttown).
ReuseSurfaces = true

# The game's read locks (taken hundreds of times a frame) make two to six calls into the
# Windows kernel each. true = they count readers without kernel calls (the same rules).
FastReadLocks = true

# The game's effects library (particles: fog, fire, sparks, the dragons' acid) was
# shipped as a debug build: every one of its functions fills its memory with a test
# pattern on entry and checks it on exit. Views with many particles are slow out of
# proportion to what they show (the Darkroot tunnel toward the elevator). true = those
# checks are skipped; the effects look and behave the same.
FastEffects = true

# Small math routines the game's renderer and effects call tens of thousands of times a
# frame (adding, subtracting and multiplying four numbers at once, adding two matrices)
# run as faster code with exactly the same results.
FastRenderMath = true

[Diagnostics]
# Development only. Leave these off for normal play.

# Log a per-second frame and command summary for this many seconds after start.
# 0 = off.
Survey = 0

# Performance: a [perf] line every 5 seconds (frames per second, the game thread's update
# and the render thread's frame times, how busy both threads are, Direct3D calls per
# frame, your position). Press F10 in a slow scene to sample every busy thread for 10
# seconds and log which code the time goes to.
Profile = false

# With Trace = true: F4/F5/F6/F7 switch the frame rate live to 30/60/120/240 FPS,
# F9 records the player's state to PTDE-FPS-Unlock-trace-N.csv and F11 records the
# player's object graph to PTDE-FPS-Unlock-deep-N.csv (both large), and Ctrl+1 to
# Ctrl+7, Ctrl+9 and Ctrl+0 toggle the fixes above (1 slide, 2 damping, 3 timers,
# 4 smoothing, 5 graze, 6 step down, 7 camera, 9 lock-on turn, 0 foot IK).
Trace = false

# Log the dragons' acid and the pool it leaves ([bullet] lines): the Valley of Drakes
# undead dragon and the Gaping Dragon. For the pool that does not show above 30 FPS.
BulletTrace = false

# An effect id: the code that reads its first emitter timing block is logged (SfxWatch lines),
# to check FixSfxSpawnRate. 16012 is the undead dragon's acid. 0 = off.
SfxWatch = 0

# Log the HUD shortcut actions (D-pad item and weapon cycling) with timestamps, to
# diagnose repeat speed. Hold the D-pad for a few seconds, then read the [input] lines.
InputLog = false

# Hash every vertex shader constant upload to count presents whose content did not
# change (logged with the Survey). Costs CPU every frame.
ContentProbe = false

# Hardware write watchpoints on player fields (F8 arms and reports), for example
# "p:180,c:1B8". Leave empty.
Watch =
